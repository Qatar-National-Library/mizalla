<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="600">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qatar National Library · Digital Signage Slideshow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .carousel-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .carousel-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.2s ease-in-out, visibility 1.2s ease-in-out;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: #000000;
      z-index: 1;
    }
    .carousel-slide.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      text-align: center;
      color: #64748b;
    }
    .empty-state h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }
    .empty-state p {
      font-size: 1rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  {% if items %}
  <div class="carousel-container" id="signage-carousel" data-interval="{{ slide_interval }}">
    {% for item in items %}
    <div class="carousel-slide {% if loop.first %}active{% endif %}"
         id="slide-{{ loop.index }}"
         data-index="{{ loop.index0 }}"
         data-title="{{ item.friendly_name }}"
         style="background-image: url('{{ get_public_media_url(item.filename) }}');">
    </div>
    {% endfor %}
  </div>

  <script>
    (function() {
      const slides = document.querySelectorAll('.carousel-slide');
      if (slides.length <= 1) return;

      const container = document.getElementById('signage-carousel');
      const intervalMs = parseInt(container.getAttribute('data-interval') || '10000', 10);
      let currentIndex = 0;

      function nextSlide() {
        slides[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % slides.length;
        slides[currentIndex].classList.add('active');
      }

      setInterval(nextSlide, intervalMs);
    })();
  </script>
  {% else %}
  <div class="empty-state">
    <h1>Qatar National Library</h1>
    <p>Media Wall Signage · Standby Mode</p>
  </div>
  {% endif %}
</body>
</html>
