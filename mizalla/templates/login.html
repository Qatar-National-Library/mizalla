{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="login-layout">
  <div class="login-aside">
    <p class="eyebrow">PROJECT OPERATIONS / 01</p>
    <h1>Work, clearly<br>in progress.</h1>
    <p class="login-note">A shared record for the people, decisions and steps behind every project.</p>
    <span class="aside-rule" aria-hidden="true"></span>
  </div>
  <div class="login-panel">
    <p class="eyebrow">MEMBER ACCESS</p>
    <h2>Sign in</h2>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email address<input type="email" name="email" autocomplete="username" required autofocus></label>
      <label>Password
        <div class="password-input-wrapper">
          <input type="password" name="password" autocomplete="current-password" required>
          <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password" tabindex="-1">
            <i data-lucide="eye" class="icon-green"></i>
          </button>
        </div>
      </label>
      <button class="button button-primary" type="submit">Continue <span aria-hidden="true">→</span></button>
    </form>
  </div>
</section>
{% endblock %}
