<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="600">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qatar National Library · Digital Signage Video Reel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background-color: #000000;
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      text-align: center;
      color: #64748b;
    }
    .empty-state h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }
    .empty-state p {
      font-size: 1rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body style="margin: 0px; padding: 0px; width: 100%; background-color: #000; overflow: hidden;">
  {% if video_urls %}
  <video muted autoplay playsinline id="myVideo" data-videos="{{ video_urls_str }}" width="100%"></video>

  <script>
    (function() {
      const videoEl = document.getElementById("myVideo");
      if (!videoEl) return;

      const rawVideos = videoEl.getAttribute("data-videos");
      if (!rawVideos) return;

      const videoSource = rawVideos.split(";").filter(v => v.trim() !== "");
      const videoCount = videoSource.length;
      let currentIndex = 0;

      function videoPlay(num) {
        if (num >= videoCount) {
          currentIndex = 0;
          num = 0;
        }
        console.log("Playing video (" + num + ") -> " + videoSource[num]);
        videoEl.setAttribute("src", videoSource[num]);
        videoEl.load();
        const playPromise = videoEl.play();
        if (playPromise !== undefined) {
          playPromise.catch(function(error) {
            console.warn("Autoplay was prevented or playback error:", error);
          });
        }
      }

      function videoEndedHandler() {
        currentIndex++;
        if (currentIndex >= videoCount) {
          currentIndex = 0;
        }
        videoPlay(currentIndex);
      }

      videoEl.addEventListener("ended", videoEndedHandler, false);

      // Start playback
      setTimeout(function() {
        videoPlay(0);
      }, 300);
    })();
  </script>
  {% else %}
  <div class="empty-state">
    <h1>Qatar National Library</h1>
    <p>Media Wall Signage · Video Standby Mode</p>
  </div>
  {% endif %}
</body>
</html>
